# ============================================================================
# MULTI-PLATFORM FLUTTER BUILD PIPELINE
# ============================================================================
trigger:
  - main
  - master

stages:
# ============================================================================
# STAGE 1: ANDROID BUILD
# ============================================================================
- stage: AndroidStage
  displayName: Android
  pool:
    vmImage: 'ubuntu-latest'
  dependsOn: []
  jobs:
  - job: AndroidJob
    displayName: Android Build & Test
    steps: 
    - task: DownloadSecureFile@1
      name: keyprop
      displayName: Download Android keystore properties
      inputs:
        secureFile: 'key.properties'

    - task: DownloadSecureFile@1
      name: key
      displayName: Download Android signing keystore
      inputs:
        secureFile: 'key.jks'

    - task: Bash@3
      displayName: Copy signing credentials to build directories
      inputs:
        targetType: 'inline'
        script: |
          cp $(keyprop.secureFilePath) $(Build.SourcesDirectory)/android/key.properties
          cp $(key.secureFilePath) $(Build.SourcesDirectory)/android/app/key.jks
          
    - template: setup-flutter.yml
      parameters:
        target: 'aab'

    - task: CopyFiles@2
      displayName: Copy AAB artifact to staging directory
      inputs:
        sourceFolder: '$(Agent.BuildDirectory)'
        contents: '**/bundle/**'
        targetFolder: '$(Build.StagingDirectory)'
        flattenFolders: true

    - task: PublishBuildArtifacts@1
      displayName: Publish AAB to pipeline artifacts
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'AAB'
        publishLocation: 'Container'

# ============================================================================
# STAGE 2: iOS BUILD
# ============================================================================
- stage: iOSStage
  displayName: iOS
  pool: 
    vmImage: 'macos-latest'
  dependsOn: []
  jobs:
  - job: iOSJob
    displayName: iOS Build & Test
    steps: 
    - task: InstallAppleCertificate@2
      displayName: Install Apple Developer certificate (.p12)
      inputs:
        certSecureFile: 'iosKey'
        certPwd: 'yourPwd'
        keychain: 'temp'
    
    - task: InstallAppleProvisioningProfile@1
      displayName: Install Apple provisioning profile (.mobileprovision)
      inputs:
        provisioningProfileLocation: 'secureFiles'
        provProfileSecureFile: 'ios_Profile.mobileprovision'
        
    - template: setup-flutter.yml
      parameters:
        target: 'ipa'
        exportOptionsPlist: 'ios/exportOptions.plist'

    - task: CopyFiles@2
      displayName: Copy IPA artifact to staging directory
      inputs:
        sourceFolder: '$(Agent.BuildDirectory)'
        contents: '**/ipa/*.ipa'
        targetFolder: '$(Build.StagingDirectory)'
        flattenFolders: true

    - task: PublishBuildArtifacts@1
      displayName: Publish IPA to pipeline artifacts
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'IPA'
        publishLocation: 'Container'
        
# ============================================================================
# STAGE 3: WINDOWS BUILD
# ============================================================================
- stage: winStage
  displayName: Windows
  pool: 
    vmImage: 'windows-latest'
  dependsOn: []
  jobs:
  - job: windowsJob
    displayName: Windows Build & Test
    steps: 
    - template: setup-flutter.yml
      parameters:
        target: 'windows'

    - task: FlutterCommand@0
      displayName: Create MSIX installer package
      inputs:
        projectDirectory: '$(Build.SourcesDirectory)'
        arguments: 'pub run msix:create --build-windows false'

    - task: CopyFiles@2
      displayName: Copy MSIX artifact to staging directory
      inputs:
        sourceFolder: '$(Agent.BuildDirectory)'
        contents: '**/*.msix'
        targetFolder: '$(Build.StagingDirectory)'
        flattenFolders: true

    - task: PublishBuildArtifacts@1
      displayName: Publish MSIX to pipeline artifacts
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'Windows'
        publishLocation: 'Container'

# ============================================================================
# STAGE 4: WEB BUILD
# ============================================================================
- stage: webStage
  displayName: Web
  pool: 
    vmImage: 'ubuntu-latest'
  dependsOn: []
  jobs:
  - job: webJob
    displayName: Web Build & Test
    steps: 
    - template: setup-flutter.yml
      parameters:
        target: 'web'

    - task: CopyFiles@2
      displayName: Copy Web artifact to staging directory
      inputs:
        sourceFolder: '$(Build.SourcesDirectory)'
        contents: 'build/web/**'
        targetFolder: '$(Build.StagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: Publish Web to pipeline artifacts
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'Web'
        publishLocation: 'Container'
